services:
    # frozen by scenarios, see App\Tests\Behat\Support\FrozenTime
    clock:
        class: Symfony\Component\Clock\MockClock

    Symfony\Component\Clock\MockClock: '@clock'

    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\Behat\Support\Provider\TestProvider:
        tags: [ app.provider ]
