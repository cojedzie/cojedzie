services:
    # frozen by scenarios, see App\Tests\Behat\Support\FrozenTime
    clock:
        class: Symfony\Component\Clock\MockClock

    Symfony\Component\Clock\MockClock: '@clock'

    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Behat\:
        resource: '../tests/Behat/*'

    App\Tests\Behat\Support\Provider\TestProvider:
        tags: [ app.provider ]

    # scenarios run without a Mercure server
    mercure.hub.default:
        class: Symfony\Component\Mercure\MockHub
        arguments:
            $url: '%env(MERCURE_URL)%'
            $publicUrl: '%env(MERCURE_PUBLIC_URL)%'
            $jwtProvider: !service
                class: Symfony\Component\Mercure\Jwt\StaticTokenProvider
                arguments: ['test']
            $publisher: '@App\Tests\Behat\Support\DiscardedUpdates'
