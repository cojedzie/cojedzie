framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: false

    # new ids stay UUIDv6 (Symfony 7 defaults to v7), like the ones already stored
    uid:
        default_uuid_version: 6
        time_based_uuid_version: 6

    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            handler_id: null
            cookie_samesite: lax
            cookie_secure: auto
