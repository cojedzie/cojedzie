monolog:
    handlers:
        sentry:
            type: service
            id: app.sentry_issues
        sentry_logs:
            type: service
            id: Sentry\SentryBundle\Monolog\LogsHandler
            # deprecations are logged at info level on every request
            channels: ["!php", "!deprecation"]
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
            # exclude all 404 errors from the logs
            excluded_http_codes: [404]
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine"]
        deprecation:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
        deprecation_filter:
            type: filter
            handler: deprecation
            max_level: info
            channels: ["php"]
