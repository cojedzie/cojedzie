parameters:
  env(APP_EVENT_QUEUE): "doctrine://default"

framework:
  messenger:
    transports:
      main: '%env(resolve:APP_EVENT_QUEUE)%'
      sync: 'sync://'

    # the worker consumes main, see COJEDZIE_WORKER_QUEUES
    routing:
      App\Message\UpdateDataSources: main
      App\Message\CollectStaleData: main
