when@prod:
  sentry:
    dsn: '%env(SENTRY_DSN)%'

    register_error_listener: false # Disables the ErrorListener to avoid duplicated log in sentry
    register_error_handler: false # Disables the ErrorListener, ExceptionListener and FatalErrorListener integrations of the base PHP SDK

    messenger:
      # workers handle many messages, keep their scopes, logs and breadcrumbs apart
      isolate_context_by_message: true

    tracing:
      console:
        excluded_commands:
          - messenger:consume
          - schedule:run
          - federation:check

    options:
      release: '%env(COJEDZIE_VERSION)%'
      environment: '%env(resolve:SENTRY_ENVIRONMENT)%'
      traces_sampler: App\Service\SentrySampler
      enable_logs: true
      ignore_exceptions:
        - Symfony\Component\HttpKernel\Exception\NotFoundHttpException

  services:
    # errors as Sentry issues, see the sentry handler in prod/monolog.yaml
    app.sentry_issues:
      class: Sentry\Monolog\Handler
      arguments:
        - '@Sentry\State\HubInterface'
        - !php/const Monolog\Logger::ERROR

    # minimum level of logs sent to Sentry Logs, see the sentry_logs handler in prod/monolog.yaml
    Sentry\SentryBundle\Monolog\LogsHandler:
      arguments:
        - !php/const Monolog\Logger::INFO
