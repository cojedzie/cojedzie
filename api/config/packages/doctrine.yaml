parameters:
    env(COJEDZIE_DATABASE_URL): ''

doctrine:
    dbal:
        driver: 'pdo_sqlite'
        url: '%env(resolve:COJEDZIE_DATABASE_URL)%'
        logging: '%kernel.debug%'
        profiling: '%kernel.debug%'
        types:
            datetime: App\Doctrine\CarbonDateTimeType
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
