security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # servers are loaded by App\Security\FederatedServerAuthenticator, which also rejects malformed ids
        federated_servers:
            entity:
                class: App\Entity\Federation\FederatedServerEntity

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        federation:
            pattern: ^/api/v1/federation
            stateless: true
            provider: federated_servers
            custom_authenticators:
                - App\Security\FederatedServerAuthenticator
            entry_point: App\Security\FederatedServerAuthenticator

    access_control:
        - { path: ^/api/v1/federation, roles: ROLE_FEDERATED_SERVER }

when@test:
    security:
        password_hashers:
            # hashers are slow by design, tests don't need that
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
