# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  locale: 'pl'

  env(FEDERATION_HUB): 'https://cojedzie.pl'
  env(FEDERATION_CONNECTION_ID): null
  env(FEDERATION_SERVER_ID): null
  env(FEDERATION_URL): null
  env(FEDERATION_SERVER_SECRET): null

  env(CORS_ALLOW_ORIGIN): '^https?://.*'

  env(MERCURE_JWT_SECRET): ''
  env(MERCURE_URL): ''
  env(MERCURE_PUBLIC_URL): ''

  env(SENTRY_ENVIRONMENT): '%kernel.environment%'

  # ZTM Gdańsk open data, see App\Provider\ZtmGdansk\ZtmGdanskConfig
  env(ZTM_GDANSK_API_URL): 'https://ckan2.multimediagdansk.pl'
  env(ZTM_GDANSK_STOPS_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/4c4025f0-01bf-41f7-a39f-d156d201b82b/download/stops.json'
  env(ZTM_GDANSK_ROUTES_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/22313c56-5acf-41c7-a5fd-dc5dc72b3851/download/routes.json'
  env(ZTM_GDANSK_TRIPS_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/b15bb11c-7e06-4685-964e-3db7775f912f/download/trips.json'
  env(ZTM_GDANSK_STOPS_IN_TRIPS_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/3115d29d-b763-4af5-93f6-763b835967d6/download/stopsintrips.json'
  env(ZTM_GDANSK_AGENCIES_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/dff5f71f-0134-4ef3-8116-73c1a8e929a5/download/agencies.json'
  env(ZTM_GDANSK_DISPLAYS_URL): 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/ee910ad8-8ffa-4e24-8ef9-d5a335b07ccb/download/displays.json'

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    public: false       # Allows optimizing the container by removing unused services; this also means

  _instanceof:
    App\Provider\Provider:
      tags: [ app.provider ]

    App\DataImport\DataImporter:
      tags: [ app.data_importer ]

    App\DataConverter\Converter:
      tags: [ app.converter ]

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/*'
    exclude: '../src/{DependencyInjection,Exception,Modifier,Entity,Message,Dto,Migrations,Tests,Parser,Functions,Filter,Utility,Kernel.php}'

  # controllers are imported separately to make sure services can be injected
  # as action arguments even if you don't extend any base controller class
  App\Controller\:
    resource: '../src/Controller'
    tags: [ 'controller.service_arguments' ]

  App\Provider\:
    resource: '../src/Provider'
    public: true

  App\Filter\Handler\:
    resource: '../src/Filter/Handler'
    tags: [ app.handler ]

  # converter
  App\DataConverter\AggregateConverter:
    arguments:
      - !tagged_iterator app.converter

  App\DataConverter\Converter: '@App\DataConverter\AggregateConverter'

  # other servces
  App\Service\ProviderResolver:
    arguments: [ !tagged_iterator app.provider, '%kernel.debug%' ]

  App\Service\HandlerProvider:
    arguments: [ !tagged_locator app.handler ]
    shared: false

  App\Service\HandlerProviderFactory:
    arguments: [ !tagged_locator app.handler ]

  App\Service\DataUpdater:
    arguments:
      $importers: !tagged_iterator app.data_importer

  App\Service\SentrySampler:
    arguments:
      $sampleRate: '%env(float:SENTRY_SAMPLE_RATE)%'

  app.import.logger: '@monolog.logger.import'

  app.import.progress_reporter_factory:
    class: App\DataImport\ProgressReporterFactory
    arguments:
      $logger: '@app.import.logger'

  App\DataImport\ProgressReporterFactory: '@app.import.progress_reporter_factory'

  App\Service\RequirementsArgumentResolver:
    decorates: 'argument_resolver'

  App\Serialization\Serializer:
    decorates: serializer
    arguments:
      $decorated: '@App\Serialization\Serializer.inner'

  App\Serialization\Normalizer\DtoNormalizer:
    decorates: serializer.normalizer.object
    arguments:
      $decorated: '@App\Serialization\Normalizer\DtoNormalizer.inner'

  App\Serialization\MetadataLoader:
    decorates: 'serializer.mapping.chain_loader'

  # Context Providers
  App\Context\FederationContext:
    arguments:
      $serverId: '%env(FEDERATION_SERVER_ID)%'
      $connectionId: '%env(FEDERATION_CONNECTION_ID)%'
      $hubBaseUrl: '%env(FEDERATION_HUB)%'
      $advertisedUrl: '%env(FEDERATION_URL)%'
      $serverSecret: '%env(FEDERATION_SERVER_SECRET)%'
