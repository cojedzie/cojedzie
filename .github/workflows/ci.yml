name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ds-1.8.0, intl, bcmath, zip, sockets, pdo_sqlite, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Coding standard
        run: vendor/bin/ecs check --no-progress-bar
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: Prepare test database
        run: |
          mkdir -p var/db
          rm -f var/db/test.db
          bin/console --env=test doctrine:migrations:migrate --no-interaction --quiet
      - name: PHPUnit
        run: bin/phpunit --log-junit var/junit/phpunit.xml
      - name: Behat
        run: >
          vendor/bin/behat --no-interaction --fail-on-behat-deprecations --tags='~@wip'
          --format=progress --out=std --format=junit --out=var/junit/behat

  # images for next, pushed only from master; deployed by the deploy-next workflow
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Login to registry.kadet.net
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Expose actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'True')
      # FontAwesome Pro is licensed and not stored in the repository, see front/resources/fontawesome
      - name: Fetch FontAwesome Pro packages
        uses: ./.github/actions/fontawesome
        with:
          url: ${{ secrets.FONTAWESOME_S3_URL }}
          access-key: ${{ secrets.FONTAWESOME_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.FONTAWESOME_S3_SECRET_KEY }}
      - name: Build and push
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          .utils/build-images.sh \
            --build-registry localhost:5000 \
            --publish-registry registry.kadet.net \
            --tag next \
            --default-only \
            --digests digests.txt \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ${{ github.ref == 'refs/heads/master' && '--push' || '' }} \
            -- api worker front;
      - name: Upload image digests
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: digests.txt
          if-no-files-found: error
