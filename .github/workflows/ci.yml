name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ds-php-ds/ext-ds@v2.0.0, intl, bcmath, zip, sockets, pdo_sqlite, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Coding standard
        run: vendor/bin/ecs check --no-progress-bar
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Prepare test database
        run: |
          mkdir -p var/db
          rm -f var/db/test.db
          bin/console --env=test doctrine:migrations:migrate --no-interaction --quiet
      - name: PHPUnit
        run: bin/phpunit --log-junit var/junit/phpunit.xml
      - name: Behat
        run: >
          vendor/bin/behat --no-interaction --fail-on-behat-deprecations --tags='~@wip'
          --format=progress --out=std --format=junit --out=var/junit/behat

  test-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: front/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Prettier
        run: yarn check:format
      - name: ESLint
        run: yarn lint
      - name: Type check
        run: yarn check:types
      - name: Vitest
        run: yarn test:app --run

  # every engine's migrations, run on an empty database, must give exactly the schema the mapping describes
  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            database: 'sqlite:///%kernel.project_dir%/var/db/schema.db'
          - engine: mysql
            database: 'mysql://cojedzie:cojedzie@127.0.0.1:3306/cojedzie?serverVersion=mariadb-10.7.1'
          - engine: postgres
            database: 'postgres://cojedzie:cojedzie@127.0.0.1:5432/cojedzie?serverVersion=14'
    name: schema (${{ matrix.engine }})
    services:
      mysql:
        image: ${{ matrix.engine == 'mysql' && 'mariadb:10.7' || '' }}
        env:
          MARIADB_DATABASE: cojedzie
          MARIADB_USER: cojedzie
          MARIADB_PASSWORD: cojedzie
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.engine == 'postgres' && 'postgres:14' || '' }}
        env:
          POSTGRES_DB: cojedzie
          POSTGRES_USER: cojedzie
          POSTGRES_PASSWORD: cojedzie
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U cojedzie" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COJEDZIE_DATABASE_URL: ${{ matrix.database }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ds-php-ds/ext-ds@v2.0.0, intl, bcmath, zip, sockets, pdo_sqlite, pdo_mysql, pdo_pgsql, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run migrations
        run: |
          mkdir -p var/db
          bin/console doctrine:migrations:migrate --no-interaction
      - name: Compare with the mapping
        run: bin/console doctrine:schema:validate

  # images for next, pushed only from master; deployed by the deploy-next workflow
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry.kadet.net
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Describe the version
        id: version
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: bake
        uses: docker/bake-action@v7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ci
          push: ${{ github.ref == 'refs/heads/master' }}
          vars: |
            REGISTRIES=registry.kadet.net
            TAGS=next
            COJEDZIE_VERSION=${{ steps.version.outputs.version }}
            COJEDZIE_REVISION=${{ github.sha }}
            GHA_CACHE=true
      - name: Write image digests
        if: github.ref == 'refs/heads/master'
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "$METADATA" > metadata.json
          contrib/bake-digests.sh metadata.json "$VERSION" next api worker front > digests.txt
      - name: Upload image digests
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: digests.txt
          if-no-files-found: error
