name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        # a missing extension fails here, instead of as confusing errors of the tools that need it
        env:
          fail-fast: true
        with:
          php-version: '8.5'
          extensions: ds-2.0.0, intl, bcmath, zip, sockets, pdo_sqlite, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Coding standard
        run: vendor/bin/ecs check --no-progress-bar
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Prepare test database
        run: |
          mkdir -p var/db
          rm -f var/db/test.db
          bin/console --env=test doctrine:migrations:migrate --no-interaction --quiet
      - name: PHPUnit
        run: bin/phpunit --log-junit var/junit/phpunit.xml
      - name: Behat
        run: >
          vendor/bin/behat --no-interaction --fail-on-behat-deprecations --tags='~@wip'
          --format=progress --out=std --format=junit --out=var/junit/behat

  test-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prettier
        run: npm run check:format
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run check:types
      - name: Vitest
        run: npm run test:app -- --run

  # every engine's migrations, run on an empty database, must give exactly the schema the mapping describes
  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            database: 'sqlite:///%kernel.project_dir%/var/db/schema.db'
          - engine: mysql
            database: 'mysql://cojedzie:cojedzie@127.0.0.1:3306/cojedzie?serverVersion=mariadb-10.7.1'
          - engine: postgres
            database: 'postgres://cojedzie:cojedzie@127.0.0.1:5432/cojedzie?serverVersion=14'
    name: schema (${{ matrix.engine }})
    services:
      mysql:
        image: ${{ matrix.engine == 'mysql' && 'mariadb:10.7' || '' }}
        env:
          MARIADB_DATABASE: cojedzie
          MARIADB_USER: cojedzie
          MARIADB_PASSWORD: cojedzie
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.engine == 'postgres' && 'postgres:14' || '' }}
        env:
          POSTGRES_DB: cojedzie
          POSTGRES_USER: cojedzie
          POSTGRES_PASSWORD: cojedzie
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U cojedzie" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COJEDZIE_DATABASE_URL: ${{ matrix.database }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        # a missing extension fails here, instead of as confusing errors of the tools that need it
        env:
          fail-fast: true
        with:
          php-version: '8.5'
          extensions: ds-2.0.0, intl, bcmath, zip, sockets, pdo_sqlite, pdo_mysql, pdo_pgsql, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run migrations
        run: |
          mkdir -p var/db
          bin/console doctrine:migrations:migrate --no-interaction
      - name: Compare with the mapping
        run: bin/console doctrine:schema:validate

  # images for next, pushed only from master; deployed by the deploy-next workflow
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # few parallel uploads per registry: our registry's storage answers bursts with 503, failing the push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [system]
              maxRegistryConcurrency = 2
      # images are only pushed from master; Dependabot's runs have no access to the secrets
      - name: Login to registry.kadet.net
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Describe the version
        id: version
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
      # the GitHub runtime variables the gha cache needs, which bake-action used to pass on its own
      - name: Expose the GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # the registry gives up on an upload its object storage rejects (503) and has no option to retry longer, so a
      # failed push is tried twice more after a pause; layers already pushed are not sent again
      - name: Build and push
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          REGISTRIES: registry.kadet.net
          TAGS: next
          COJEDZIE_VERSION: ${{ steps.version.outputs.version }}
          COJEDZIE_REVISION: ${{ github.sha }}
          GHA_CACHE: 'true'
          PUSH: ${{ github.ref == 'refs/heads/master' && 'true' || '' }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx bake -f docker-bake.hcl --metadata-file metadata.json ${PUSH:+--push} ci; then
              exit 0
            fi
            if [[ $attempt -lt 3 ]]; then
              echo "::warning::Push failed (attempt $attempt of 3), trying again in $((attempt * 60)) s"
              sleep $((attempt * 60))
            fi
          done
          exit 1
      - name: Write image digests
        if: github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          contrib/bake-digests.sh metadata.json "$VERSION" next api worker front > digests.txt
      - name: Upload image digests
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: digests.txt
          if-no-files-found: error
