name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2026.1.0
        required: true

permissions:
  contents: write
  checks: read
  # the deploy workflow downloads image digests
  actions: read

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # master releases any newer version, a release/YYYY.N branch only patches of its own line
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            line=""
          elif [[ "$GITHUB_REF" =~ ^refs/heads/release/([0-9]{4}\.[0-9]+)$ ]]; then
            line=${BASH_REMATCH[1]}
          else
            echo "::error::Releases are made from master or a release/YYYY.N branch, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like YYYY.N.P, got $VERSION"
            exit 1
          fi
          if [[ -n "$line" ]] && [[ "${VERSION%.*}" != "$line" ]]; then
            echo "::error::release/$line releases $line.P versions, got $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          newer () {
            [[ -z "$1" ]] || [[ $(printf '%s\n' "$1" "v$VERSION" | sort -V | tail -n 1) == "v$VERSION" ]]
          }
          newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          newest_of_line=$(git tag --list "v${line:+$line.}*" --sort=-version:refname | head -n 1)
          if ! newer "$newest_of_line"; then
            echo "::error::Version $VERSION is not newer than $newest_of_line"
            exit 1
          fi
          # a patch of an older line is published, but neither marked latest nor deployed over a newer release
          latest=false
          if newer "$newest"; then
            latest=true
          fi
          # notes cover the commits since the release this branch was last tagged with
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)
          {
            echo "version=$VERSION"
            echo "previous=$previous"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      # the test jobs of the CI workflow already ran on every pushed commit
      - name: Require passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in test test-front; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
              --jq '.check_runs | map(select(.conclusion == "success")) | length')
            if [[ "$passed" -eq 0 ]]; then
              echo "::error::The $check check has not passed on $GITHUB_SHA"
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # images take their version from git describe, the tag itself is published with the release
      - name: Tag locally
        run: git tag "v${{ needs.prepare.outputs.version }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry.kadet.net
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Describe the version and tags
        id: version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
          tags="$VERSION,${VERSION%.*}"
          if [[ "$LATEST" == true ]]; then
            tags="$tags,latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      # all images and variants, released images are public and used outside our deployment
      - name: Build and push
        id: bake
        uses: docker/bake-action@v7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # provenance makes the metadata too big to pass in an environment variable, only digests are read
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          files: docker-bake.hcl
          targets: release
          push: true
          vars: |
            REGISTRIES=registry.kadet.net,docker.io
            TAGS=${{ steps.version.outputs.tags }}
            COJEDZIE_VERSION=${{ steps.version.outputs.version }}
            COJEDZIE_REVISION=${{ github.sha }}
            GHA_CACHE=true
      - name: Write image digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s' "$METADATA" > metadata.json
          contrib/bake-digests.sh metadata.json "$VERSION" "$TAG" api worker front standalone > digests.txt
      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: digests.txt
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          git tag "v$VERSION"
          contrib/release-notes.sh "$PREVIOUS" "v$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --latest="$LATEST"

  deployment:
    needs: [prepare, release]
    # production runs the newest release, a patch of an older line must not replace it
    if: needs.prepare.outputs.latest == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      run-id: ${{ github.run_id }}
    secrets: inherit
