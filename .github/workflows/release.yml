name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2026.1.0
        required: true

permissions:
  contents: write
  checks: read
  # the deploy workflow downloads image digests
  actions: read

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases are made from master, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like YYYY.N.P, got $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ -n "$previous" ]] && [[ $(printf '%s\n' "$previous" "v$VERSION" | sort -V | tail -n 1) != "v$VERSION" ]]; then
            echo "::error::Version $VERSION is not newer than $previous"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      # the test jobs of the CI workflow already ran on every master commit
      - name: Require passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in test test-front; do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check" \
              --jq '.check_runs | map(select(.conclusion == "success")) | length')
            if [[ "$passed" -eq 0 ]]; then
              echo "::error::The $check check has not passed on $GITHUB_SHA"
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # images take their version from git describe, the tag itself is published with the release
      - name: Tag locally
        run: git tag "v${{ needs.prepare.outputs.version }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to registry.kadet.net
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Describe the version and tags
        id: version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
          echo "tags=$VERSION,${VERSION%.*},latest" >> "$GITHUB_OUTPUT"
      # all images and variants, released images are public and used outside our deployment
      - name: Build and push
        id: bake
        uses: docker/bake-action@v7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # provenance makes the metadata too big to pass in an environment variable, only digests are read
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          files: docker-bake.hcl
          targets: release
          push: true
          vars: |
            REGISTRIES=registry.kadet.net,docker.io
            TAGS=${{ steps.version.outputs.tags }}
            COJEDZIE_VERSION=${{ steps.version.outputs.version }}
            COJEDZIE_REVISION=${{ github.sha }}
            GHA_CACHE=true
      - name: Write image digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s' "$METADATA" > metadata.json
          contrib/bake-digests.sh metadata.json "$VERSION" "$TAG" api worker front standalone > digests.txt
      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: digests
          path: digests.txt
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          git tag "v$VERSION"
          contrib/release-notes.sh "$PREVIOUS" "v$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  deployment:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      run-id: ${{ github.run_id }}
    secrets: inherit
