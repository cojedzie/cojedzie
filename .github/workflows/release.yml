name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2026.1.0
        required: true

permissions:
  contents: write
  checks: read

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases are made from master, not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like YYYY.N.P, got $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ -n "$previous" ]] && [[ $(printf '%s\n' "$previous" "v$VERSION" | sort -V | tail -n 1) != "v$VERSION" ]]; then
            echo "::error::Version $VERSION is not newer than $previous"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      # the test job of the next workflow already ran on every master commit
      - name: Require passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=test" \
            --jq '.check_runs | map(select(.conclusion == "success")) | length')
          if [[ "$passed" -eq 0 ]]; then
            echo "::error::The test check has not passed on $GITHUB_SHA"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      api: ${{ steps.build.outputs.api }}
      worker: ${{ steps.build.outputs.worker }}
      front: ${{ steps.build.outputs.front }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # images take their version from git describe, the tag itself is published with the release
      - name: Tag locally
        run: git tag "v${{ needs.prepare.outputs.version }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Login to registry.kadet.net
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Expose actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'True')
      # FontAwesome Pro is licensed and not stored in the repository, see front/resources/fontawesome
      - name: Fetch FontAwesome Pro packages
        uses: ./.github/actions/fontawesome
        with:
          url: ${{ secrets.FONTAWESOME_S3_URL }}
          access-key: ${{ secrets.FONTAWESOME_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.FONTAWESOME_S3_SECRET_KEY }}
      # all images and variants, released images are public and used outside our deployment
      - name: Build and push
        id: build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          .utils/build-images.sh \
            --build-registry localhost:5000 \
            --publish-registry registry.kadet.net \
            --publish-registry docker.io \
            --tag "$VERSION" \
            --tag "${VERSION%.*}" \
            --tag latest \
            --digests "$GITHUB_OUTPUT" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          git tag "v$VERSION"
          .utils/release-notes.sh "$PREVIOUS" "v$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md

  deployment:
    runs-on: ubuntu-latest
    needs: [build, release]
    environment: production
    steps:
      - name: Deploy via kadet.net API Server
        uses: kadet1090/swarm-deploy-action@v1
        with:
          api-token: ${{ secrets.API_SERVER_TOKEN }}
          service: ${{ vars.API_SERVER_SERVICE }}
          # pin images by digest, so the service never runs an older image cached under the same tag
          vars: |
            cojedzie_api_version: ${{ needs.build.outputs.api }}
            cojedzie_worker_version: ${{ needs.build.outputs.worker }}
            cojedzie_front_version: ${{ needs.build.outputs.front }}
