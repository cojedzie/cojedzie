name: Deploy to next env

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ds-1.8.0, intl, bcmath, zip, sockets, pdo_sqlite, amqp, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare test database
        run: |
          mkdir -p var/db
          rm -f var/db/test.db
          bin/console --env=test doctrine:migrations:migrate --no-interaction --quiet
      - name: PHPUnit
        run: bin/phpunit --log-junit var/junit/phpunit.xml
      - name: Behat
        run: >
          vendor/bin/behat --no-interaction --fail-on-behat-deprecations --tags='~@wip'
          --format=progress --out=std --format=junit --out=var/junit/behat

  build:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.build.outputs.api }}
      worker: ${{ steps.build.outputs.worker }}
      front: ${{ steps.build.outputs.front }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: registry.kadet.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Expose actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'True')
      # FontAwesome Pro is licensed and not stored in the repository, see front/resources/fontawesome
      - name: Fetch FontAwesome Pro packages
        working-directory: front/resources/fontawesome
        env:
          S3_URL: ${{ secrets.FONTAWESOME_S3_URL }}
          S3_ACCESS_KEY: ${{ secrets.FONTAWESOME_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.FONTAWESOME_S3_SECRET_KEY }}
        run: |
          region=$(sed -E 's#^https://[^/]*\.s3\.([a-z0-9-]+)\..*#\1#' <<< "$S3_URL")
          for package in pro-light-svg-icons pro-regular-svg-icons pro-solid-svg-icons; do
            curl --fail --silent --show-error \
              --aws-sigv4 "aws:amz:$region:s3" \
              --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
              --output "$package.tgz" \
              "$S3_URL/$package.tgz"
          done
          sha256sum --check <<'EOF'
          c351034245dcb0df4a331c12cd38e66c5cc09f7b99f198fcf5acf283ac02fe62  pro-light-svg-icons.tgz
          cdf4b265de5c8c9dff704ef8d0d075abe37743408bfdce13b5b8a86ffd2c9c60  pro-regular-svg-icons.tgz
          c091cd99f680acf0f9f2e87b6d6dfc0a19ca7597e6647a9c9f84b4a709b233df  pro-solid-svg-icons.tgz
          EOF
          for archive in *.tgz; do
            tar -xzf "$archive" && rm "$archive"
          done
      - name: Build and push
        id: build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          .utils/build-images.sh \
            --build-registry localhost:5000 \
            --publish-registry registry.kadet.net \
            --tag next \
            --default-only \
            --digests "$GITHUB_OUTPUT" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            ${{ github.ref == 'refs/heads/master' && '--push' || '' }} \
            -- api worker front;

  deployment:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment: next
    steps:
      - name: Deploy via kadet.net API Server
        uses: kadet1090/swarm-deploy-action@v1
        with:
          api-token: ${{ secrets.API_SERVER_TOKEN }}
          service: ${{ vars.API_SERVER_SERVICE }}
          # pin images by digest, so the service never runs an older image cached under the same tag
          vars: |
            cojedzie_api_version: ${{ needs.build.outputs.api }}
            cojedzie_worker_version: ${{ needs.build.outputs.worker }}
            cojedzie_front_version: ${{ needs.build.outputs.front }}
