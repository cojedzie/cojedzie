# https://taskfile.dev
version: '3'

vars:
  SQLITE_DSN: sqlite:///%kernel.project_dir%/var/db/app.db
  SQLITE_TEST_DSN: sqlite:///%kernel.project_dir%/var/db/test.db
  POSTGRES_DSN: postgres://cojedzie:cojedzie@postgres/cojedzie?serverVersion=14
  MYSQL_DSN: mysql://cojedzie:cojedzie@mysql/cojedzie?serverVersion=mariadb-10.7.1
  USER:
    sh: id -u

tasks:
  exec:
    desc: Execute command on one of available containers
    cmds:
      - docker compose run --rm {{.FLAGS}} -u {{.USER}} {{.SERVICE}} {{.CLI_ARGS}}

  setup:
    desc: Install dependencies and prepare the database, as a fresh clone needs
    cmds:
      - docker compose run --rm api-setup
      - docker compose run --rm front-setup

  lint:
    deps:
      - task: lint:api
      - task: lint:front

  lint:api:
    desc: Check API code style (ECS), pending Rector changes and PHPStan, as CI does
    cmds:
      - docker compose run --rm --no-deps -e COJEDZIE_API_MODE=performance api vendor/bin/ecs check --no-progress-bar
      - docker compose run --rm --no-deps -e COJEDZIE_API_MODE=performance -e COJEDZIE_RUNAS="{{.USER}}" api vendor/bin/rector process --dry-run --no-progress-bar
      - docker compose run --rm --no-deps -e COJEDZIE_RUNAS="{{.USER}}" api vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  lint:front:
    desc: Check frontend formatting (Prettier), ESLint and types (vue-tsc), as CI does
    cmds:
      - docker compose run --rm --no-deps -e HOME=/tmp {{.FLAGS}} -u {{.USER}} frontend sh -c 'yarn check:format && yarn lint && yarn check:types'

  reformat:
    deps:
      - task: reformat:api
      - task: reformat:frontend

  reformat:api:
    desc: Reformat API with ECS
    cmds:
      - docker compose run --rm --no-deps -e COJEDZIE_RUNAS="{{.USER}}" -e COJEDZIE_API_MODE=performance api vendor/bin/ecs --fix

  reformat:frontend:
    desc: Reformat Frontend with Prettier
    cmds:
      - docker compose run --rm --no-deps -u {{.USER}} frontend node_modules/.bin/prettier . --write

  test:
    # one after another, both prepare the same test database
    cmds:
      - task: test:api
      - task: test:behat
      - task: test:front

  test:api:
    desc: Test API component with phpunit
    cmds:
      - docker compose run --rm --no-deps -e HOME=/tmp -e APP_ENV=test -e COJEDZIE_DATABASE_URL="{{.SQLITE_TEST_DSN}}" {{.FLAGS}} -e COJEDZIE_RUNAS="{{.USER}}" api sh -c '
          mkdir -p var/db &&
          bin/console --env=test doctrine:migrations:migrate -n -q &&
          bin/phpunit {{.CLI_ARGS}}'

  test:front:
    desc: Test frontend with Vitest
    cmds:
      - docker compose run --rm --no-deps -e HOME=/tmp {{.FLAGS}} -u {{.USER}} frontend yarn test:app --run {{.CLI_ARGS}}

  test:behat:
    desc: Run Behat scenarios against a fresh test database
    cmds:
      - docker compose run --rm --no-deps -e HOME=/tmp -e APP_ENV=test -e COJEDZIE_DATABASE_URL="{{.SQLITE_TEST_DSN}}" {{.FLAGS}} -e COJEDZIE_RUNAS="{{.USER}}" api sh -c '
          mkdir -p var/db && rm -f var/db/test.db &&
          bin/console --env=test doctrine:migrations:migrate -n -q &&
          vendor/bin/behat --no-interaction {{.CLI_ARGS}}'

  benchmark:
    deps:
      - task: benchmark:api

  benchmark:api:
    desc: Benchmark API component with phpbench
    vars:
      REPORT: default
    cmds:
      - >
        docker compose run 
        --rm --no-deps -e COJEDZIE_API_MODE=performance {{.DOCKER_FLAGS}} 
        api vendor/bin/phpbench 
        --php-config="opcache.enable: 1, opcache.enable_cli: 1{{if .PHP_CONFIG}}, {{end}}{{.PHP_CONFIG}}"
        run {{default "tests" .TEST}} --report={{.REPORT}} {{.CLI_ARGS}}

  benchmark:profile:api:
    desc: Benchmark API component with phpbench
    vars:
      REPORT: default
    cmds:
      - >
        docker compose run 
        --rm --no-deps {{.DOCKER_FLAGS}} 
        api vendor/bin/phpbench 
        xdebug:profile tests {{.CLI_ARGS}}

  npx:
    desc: Execute yarn command
    cmds:
      - docker compose run --rm --no-deps {{.FLAGS}} -u {{.USER}} frontend npx {{.CLI_ARGS}}

  yarn:
    desc: Execute yarn command
    cmds:
      - docker compose run --rm --no-deps {{.FLAGS}} -u {{.USER}} frontend yarn {{.CLI_ARGS}}

  console:
    desc: Execute command in the symfony console
    cmds:
      - docker compose run --rm --no-deps {{.FLAGS}} -e COJEDZIE_RUNAS="{{.USER}}" api bin/console {{.CLI_ARGS}}

  composer:
    desc: Run composer in the API container
    cmds:
      - docker compose run --rm --no-deps {{.FLAGS}} -e COJEDZIE_RUNAS="{{.USER}}" -e HOME=/tmp -e COMPOSER_HOME=/tmp/composer api composer {{.CLI_ARGS}}

  api:migrations:generate:
    desc: Generate migrations for all database engines
    vars:
      RUN: docker compose run --rm --no-deps -e COJEDZIE_RUNAS="{{.USER}}"
      # the diff is taken against the migrated schema, and asks for a confirmation otherwise
      DIFF: bin/console doctrine:migrations:migrate -n -q && bin/console doctrine:migrations:diff -n
    cmds:
      - docker compose --profile postgres up -d --wait mysql postgres
      - cmd: "{{.RUN}} -e COJEDZIE_DATABASE_URL=\"{{.SQLITE_DSN}}\" api sh -c 'mkdir -p var/db && {{.DIFF}}'"
        ignore_error: true
      - cmd: "{{.RUN}} -e COJEDZIE_DATABASE_URL=\"{{.MYSQL_DSN}}\" api sh -c '{{.DIFF}}'"
        ignore_error: true
      - cmd: "{{.RUN}} -e COJEDZIE_DATABASE_URL=\"{{.POSTGRES_DSN}}\" api sh -c '{{.DIFF}}'"
        ignore_error: true

  api:update:
    desc: Update data from data providers
    cmds:
      - docker compose run --rm --no-deps {{.FLAGS}} -e COJEDZIE_API_MODE={{default "performance" .COJEDZIE_API_MODE}} api bin/console app:update {{.CLI_ARGS}}
