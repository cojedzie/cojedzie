server {
    # resolve the upstream per request, so nginx starts while storybook is not running
    resolver 127.0.0.11 valid=10s;

    server_name storybook.cojedzie.localhost;

    location / {
        set $storybook storybook:6006;
        proxy_pass http://$storybook;

        # keep the requested host, storybook's Vite dev server only answers to known hosts
        proxy_set_header Host $host;

        # Vite's hot module replacement
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
        access_log off;
    }
}
