server {
    # resolve upstreams per request, so nginx starts while some of them are not running
    resolver 127.0.0.11 valid=10s;

    server_name cojedzie.localhost;

    location /api/ {
        root /var/www/api/public/;
        try_files $uri $uri/ index.php$is_args$args;
        access_log on;
    }

    location /_profiler/ {
        root /var/www/api/public/;
        try_files $uri $uri/ index.php$is_args$args;
    }

    location /bundles/ {
        root /var/www/api/public/;
        access_log off;
        try_files $uri $uri/;
    }

    location /storybook/ {
        set $storybook storybook:6006;
        rewrite ^/storybook/(.*)$ /$1 break;
        proxy_pass http://$storybook;
        proxy_intercept_errors on;
        access_log off;
    }

    location /storybook/dist/ {
        set $storybook storybook:6006;
        proxy_pass http://$storybook;
        proxy_intercept_errors on;
        access_log off;
    }

    location / {
        try_files $uri $uri/ @frontend;
        access_log off;
    }

    location @frontend {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;
        proxy_intercept_errors on;
        access_log off;
    }

    location /.well-known/mercure {
        set $mercure mercure:80;
        proxy_pass http://$mercure;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        ## Be sure to set USE_FORWARDED_HEADERS=1 to allow the hub to use those headers ##
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location ~ (.+).php(/|$) {
        root /var/www/api/public/;

        set $api api:9000;
        fastcgi_pass $api;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public/;

        internal;
    }
}
