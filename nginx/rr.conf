server {
    # resolve upstreams per request, so nginx starts while some of them are not running
    resolver 127.0.0.11 valid=10s;

    root /var/www/front/public/;

    server_name cojedzie.localhost;

    location /_profiler/ {
        try_files $uri $uri/ @api;
    }

    location /bundles/ {
        try_files $uri $uri/ @api;
    }

    location /api/ {
        try_files $uri $uri/ @api;
    }

    location /storybook/ {
        set $storybook storybook:6006;
        rewrite ^/storybook/(.*)$ /$1 break;
        proxy_pass http://$storybook;
        proxy_intercept_errors on;
        access_log off;
    }

    location /storybook/dist/ {
        set $storybook storybook:6006;
        proxy_pass http://$storybook;
        proxy_intercept_errors on;
        access_log off;
    }

    location /.well-known/mercure {
        set $mercure mercure:80;
        proxy_pass http://$mercure;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        ## Be sure to set USE_FORWARDED_HEADERS=1 to allow the hub to use those headers ##
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location / {
        try_files $uri @frontend;
        access_log off;
    }

    location @frontend {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;
        proxy_intercept_errors on;
        access_log off;
    }

    location @api {
        set $api api:8080;
        proxy_pass http://$api;
        proxy_intercept_errors on;
    }
}
